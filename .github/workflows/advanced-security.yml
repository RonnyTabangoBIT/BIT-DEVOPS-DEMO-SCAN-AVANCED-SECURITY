name: Advanced Security Demo

on:
  push:
    branches: [main]
  # Necesario para que Copilot Autofix proponga parches en los Pull Requests (demo/copilot-autofix)
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.example }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [codeql-code-scanning, copilot-autofix]
    defaults:
      run:
        working-directory: demo/${{ matrix.example }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # VULNERABLE: code injection, input no confiable interpolado en run (CodeQL actions/code-injection)
      - name: Mostrar commit
        run: |
          echo "Commit - ${{ github.event.head_commit.message }}"
      - run: pip install -r requirements.txt pytest
      - name: Run tests
        id: pytest
        run: python -m pytest -v --junitxml=pytest-report.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-report-${{ matrix.example }}
          path: demo/${{ matrix.example }}/pytest-report.xml

      # VULNERABLE: download-artifact < 4.1.3 (CVE-2024-42471) para la demo de Dependency Review
      - name: Download test report
        if: always()
        uses: actions/download-artifact@v4.1.2
        with:
          name: pytest-report-${{ matrix.example }}
          path: demo/${{ matrix.example }}/report

      - name: Resumen de tests
        if: always()
        env:
          OUTCOME: ${{ steps.pytest.outcome }}
          EXAMPLE: ${{ matrix.example }}
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import os, xml.etree.ElementTree as ET
          print(f"## 🧪 Resumen de Tests ({os.environ['EXAMPLE']})")
          if not os.path.exists("report/pytest-report.xml"):
              print(f"❌ No se generó el reporte de tests (resultado: `{os.environ['OUTCOME']}`).")
              raise SystemExit
          suite = ET.parse("report/pytest-report.xml").getroot()
          suite = suite.find("testsuite") if suite.tag == "testsuites" else suite
          total, fail, err, skip = (int(suite.get(k, 0)) for k in ("tests", "failures", "errors", "skipped"))
          print("| Total | ✅ Pasaron | ❌ Fallaron | ⚠️ Errores | ⏭️ Omitidos |")
          print("|---|---|---|---|---|")
          print(f"| {total} | {total - fail - err - skip} | {fail} | {err} | {skip} |")
          failed = [tc for tc in suite.iter("testcase") if tc.find("failure") is not None or tc.find("error") is not None]
          if failed:
              print("\n**Resultado: ❌ Se encontraron errores**\n")
              for tc in failed:
                  print(f"- `{tc.get('classname')}.{tc.get('name')}`")
          else:
              print("\n**Resultado: ✅ Sin errores**")
          PY

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - name: Perform CodeQL Analysis
        id: analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
          output: sarif-results

      - name: Resumen de CodeQL
        if: always()
        env:
          LANGUAGE: ${{ matrix.language }}
          OUTCOME: ${{ steps.analyze.outcome }}
        run: |
          {
            echo "## 🔍 Resumen CodeQL ($LANGUAGE)"
            shopt -s nullglob
            files=(sarif-results/*.sarif)
            if [ ${#files[@]} -eq 0 ]; then
              echo "❌ El análisis no generó resultados (resultado: \`$OUTCOME\`)."
              exit 0
            fi
            count=$(jq -s '[.[].runs[].results[]] | length' "${files[@]}")
            echo "Alertas encontradas: **$count**"
            echo
            if [ "$count" -eq 0 ]; then
              echo "**Resultado: ✅ Sin vulnerabilidades detectadas**"
            else
              echo "**Resultado: ❌ Se encontraron vulnerabilidades**"
              echo
              echo "| Regla | Nivel | Ubicación | Descripción |"
              echo "|---|---|---|---|"
              jq -rs '.[].runs[].results[] |
                "| `\(.ruleId)` | \(.level // "warning") | `\(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine)` | \(.message.text | split("\n")[0] | gsub("\\|"; "\\|")) |"' "${files[@]}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependency Review
        id: review
        uses: actions/dependency-review-action@v4
        with:
          base-ref: ${{ github.event.pull_request.base.sha || github.event.before }}
          head-ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fail-on-severity: moderate

      - name: Resumen de dependencias
        if: always()
        env:
          OUTCOME: ${{ steps.review.outcome }}
          VULNERABLE_CHANGES: ${{ steps.review.outputs.vulnerable-changes }}
        run: |
          {
            echo "## 📦 Resumen Dependency Review"
            if [ -z "$VULNERABLE_CHANGES" ] || [ "$VULNERABLE_CHANGES" = "[]" ]; then
              if [ "$OUTCOME" = "success" ]; then
                echo "**Resultado: ✅ Sin dependencias vulnerables**"
              else
                echo "**Resultado: ❌ El análisis falló** (resultado: \`$OUTCOME\`). Verifique que *Dependency graph* esté habilitado."
              fi
              exit 0
            fi
            count=$(echo "$VULNERABLE_CHANGES" | jq '[.[].vulnerabilities[]] | length')
            echo "Vulnerabilidades encontradas: **$count**"
            echo
            echo "**Resultado: ❌ Se encontraron dependencias vulnerables**"
            echo
            echo "| Paquete | Versión | Severidad | Advisory | Descripción |"
            echo "|---|---|---|---|---|"
            echo "$VULNERABLE_CHANGES" | jq -r '.[] | .name as $n | .version as $v | .vulnerabilities[] |
              "| \($n) | \($v) | \(.severity) | [\(.advisory_ghsa_id)](\(.advisory_url)) | \(.advisory_summary | gsub("\\|"; "\\|")) |"'
          } >> "$GITHUB_STEP_SUMMARY"
  # Control de severidad mínima de Dependabot (demo/dependabot-severidad-minima).
  # GITHUB_TOKEN no puede leer alertas de Dependabot: requiere el secreto DEPENDABOT_ALERTS_TOKEN
  # (fine-grained PAT con permiso "Dependabot alerts: Read-only"). Sin el secreto, el job se omite con aviso.
  dependabot-severity-gate:
    name: Dependabot severidad mínima
    runs-on: ubuntu-latest
    env:
      MIN_SEVERITY: high # low | medium | high | critical
      MANIFEST_DIRECTORY: demo/dependabot-severidad-minima/
      GH_TOKEN: ${{ secrets.DEPENDABOT_ALERTS_TOKEN }}
    steps:
      - name: Evaluar alertas abiertas de Dependabot
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::Secreto DEPENDABOT_ALERTS_TOKEN no configurado; se omite el control de severidad mínima."
            echo "## 🛡️ Dependabot severidad mínima: ⚠️ omitido (falta DEPENDABOT_ALERTS_TOKEN)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/dependabot/alerts?state=open&per_page=100" \
            | jq 'add // []' > all-alerts.json
          jq --arg manifest "$MANIFEST_DIRECTORY" \
            '[.[] | select((.dependency.manifest_path // "" | ltrimstr("/")) | startswith($manifest))]' \
            all-alerts.json > alerts.json
          rank='{"low":1,"medium":2,"high":3,"critical":4}'
          blocking=$(jq --argjson r "$rank" '[.[] | select($r[.security_advisory.severity] >= $r[env.MIN_SEVERITY])] | length' alerts.json)
          total=$(jq 'length' alerts.json)
          repo_total=$(jq 'length' all-alerts.json)
          allowed=$(jq --argjson r "$rank" '[.[] | select($r[.security_advisory.severity] < $r[env.MIN_SEVERITY])] | length' alerts.json)
          threshold_rank=$(jq -r --argjson r "$rank" --arg s "$MIN_SEVERITY" '$r[$s]')
          {
            echo "## 🛡️ Dependabot: resumen de vulnerabilidades"
            echo
            echo "- **Umbral mínimo bloqueante:** \`$MIN_SEVERITY\` (se bloquean alertas con severidad igual o superior)."
            echo "- **Severidades permitidas:** por debajo de \`$MIN_SEVERITY\`."
            echo "- **Alertas abiertas en todo el repositorio:** **$repo_total**."
            echo "- **Alertas abiertas en los manifiestos \`$MANIFEST_DIRECTORY\`:** **$total**."
            echo "- **Total de vulnerabilidades en los manifiestos:** **$total** — permitidas: **$allowed**, bloqueantes: **$blocking**."
            echo
            echo "| Severidad | Vulnerabilidades | Estado respecto al umbral |"
            echo "|---|---:|---|"
            for severity in critical high medium low; do
              count=$(jq --arg severity "$severity" '[.[] | select(.security_advisory.severity == $severity)] | length' alerts.json)
              severity_rank=$(jq -r --argjson r "$rank" --arg s "$severity" '$r[$s]')
              if [ "$severity_rank" -ge "$threshold_rank" ]; then
                status="Bloquea"
              else
                status="Permitida"
              fi
              echo "| $severity | $count | $status |"
            done
            echo
            if [ "$total" -gt 0 ]; then
              echo "| Paquete | Severidad | Bloquea | Advisory | Descripción |"
              echo "|---|---|---|---|---|"
              jq -r --argjson r "$rank" '.[] |
                "| \(.security_vulnerability.package.name) | \(.security_advisory.severity) | \(if $r[.security_advisory.severity] >= $r[env.MIN_SEVERITY] then "❌" else "➖" end) | [\(.security_advisory.ghsa_id)](\(.html_url)) | \(.security_advisory.summary | gsub("\\|"; "\\|")) |"' alerts.json
              echo
            else
              echo "No hay alertas abiertas asociadas a este manifiesto."
              if [ "$repo_total" -gt 0 ]; then
                echo
                echo "Manifiestos con alertas abiertas:"
                echo
                echo "| Manifiesto | Alertas |"
                echo "|---|---|"
                jq -r 'group_by(.dependency.manifest_path)[] | "| `\(.[0].dependency.manifest_path)` | \(length) |"' all-alerts.json
              fi
              echo
              echo "> Si esperabas alertas, confirma que los manifiestos ya están en la rama predeterminada y que Dependency graph y Dependabot alerts están habilitados. Dependabot solo genera alertas para dependencias detectadas en la rama predeterminada."
            fi
            if [ "$blocking" -gt 0 ]; then
              echo "**Resultado: ❌ Hay vulnerabilidades bloqueantes (>= \`$MIN_SEVERITY\`).**"
            elif [ "$total" -eq 0 ]; then
              echo "**Resultado: ⚠️ No se encontraron alertas para este manifiesto; el umbral no se pudo evaluar.**"
            else
              echo "**Resultado: ✅ Ninguna vulnerabilidad alcanza el umbral \`$MIN_SEVERITY\`.**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$blocking" -gt 0 ]; then
            echo "::error::$blocking alerta(s) de Dependabot con severidad >= $MIN_SEVERITY"
            exit 1
          fi
