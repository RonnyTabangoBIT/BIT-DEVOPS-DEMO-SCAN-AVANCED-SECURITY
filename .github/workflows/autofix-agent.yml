name: Autofix Agent

# Remediación en lote con Copilot Autofix (equivalente a "security campaign + agente" a nivel repositorio).
# - Automático: cuando termina "Advanced Security Demo" por un push a main (ya con el análisis de CodeQL
#   actualizado). Verifica requisitos y genera los autofix, sin crear PR.
# - Manual: Actions -> Autofix Agent -> Run workflow, con opción de abrir un PR de remediación.
# Requiere Copilot Autofix habilitado (Settings -> Code security -> Code scanning). Para crear el PR:
# Settings -> Actions -> General -> "Allow GitHub Actions to create and approve pull requests".
on:
  workflow_run:
    workflows: ["Advanced Security Demo"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      min_severity:
        description: "Severidad mínima de las alertas a corregir"
        type: choice
        options: [critical, high, medium, low]
        default: high
      max_alerts:
        description: "Cantidad máxima de alertas a procesar"
        type: number
        default: 5
      create_pr:
        description: "Commitear los autofix en una rama nueva y abrir un PR"
        type: boolean
        default: false

permissions:
  contents: write         # crear la rama y commitear los autofix
  pull-requests: write    # abrir el PR de remediación
  security-events: write  # leer alertas y generar autofix

jobs:
  autofix:
    name: Autofix Agent
    # En workflow_run solo para ejecuciones disparadas por push a main (no por PRs).
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generar autofix para alertas de code scanning
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MIN_SEVERITY: ${{ inputs.min_severity || 'high' }}
          MAX_ALERTS: ${{ inputs.max_alerts || 5 }}
          CREATE_PR: ${{ inputs.create_pr || false }}
        run: python .github/scripts/autofix_agent.py
