# Política INVÁLIDA a propósito: cada valor marcado con "ERROR" debe ser detectado por validate_policy()
# (security_exceptions_audit.py). La usan las pruebas unitarias y se puede auditar con:
#   POLICY_FILE=.github/security/pruebas/politica-invalida.yml AUDIT_FIXTURES=.github/security/pruebas/descartes-simulados.json \
#   python .github/scripts/security_exceptions_audit.py

formato_id_excepcion: "EXC-(\\d{4}"                       # ERROR: paréntesis sin cerrar (regex inválida)

code_scanning:
  motivos_permitidos: ["false positive", "accepted risk"]   # ERROR: "accepted risk" no existe en la API
  comentario_minimo: -5                                     # ERROR: debe ser >= 0
  requiere_id_excepcion: ["won't fix"]                      # ERROR: "won't fix" no está en motivos_permitidos
  aprobadores: "RonnyTabangoBIT"                            # ERROR: debe ser una lista
  requiere_aprobacion_delegada: true
  severidades_con_aprobacion: [critical, urgent]            # ERROR: "urgent" no es una severidad

secret_scanning:
  resoluciones_permitidas: ["revoked", "wontfix"]           # ERROR: el valor de la API es "wont_fix"
  comentario_minimo: 20
  requiere_id_excepcion: ["used_in_tests"]                  # ERROR: no está en resoluciones_permitidas
  aprobadores: ["RonnyTabangoBIT"]
  dias_maximos_abierta_tras_bypass: "siete"                 # ERROR: debe ser un entero
