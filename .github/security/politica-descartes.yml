# =====================================================================================
# Política de descartes de hallazgos de code scanning y secret scanning.
# La valida el workflow "Auditoría de excepciones" (.github/scripts/security_exceptions_audit.py)
# sobre las alertas descartadas/resueltas en GitHub (API REST).
#
# Protegida por CODEOWNERS (/.github/): cambiarla requiere la aprobación del code owner.
# Las excepciones de DEPENDENCIAS se gestionan en .github/security/excepciones.yml.
# =====================================================================================

# Formato del ID de excepción que debe aparecer en el comentario cuando el motivo lo exige.
# Code scanning usa los IDs de .github/security/excepciones-codigo.yml (EXC-COD-AAAA-NNN);
# secret scanning, IDs EXC-AAAA-NNN.
# Ejemplo de comentario válido: "EXC-COD-2026-001: la app de demo no se despliega."
formato_id_excepcion: "EXC-(COD-)?\\d{4}-\\d{3}"

code_scanning:
  # Fuente de verdad de las excepciones de código: un descarte que cite EXC-COD-* debe referirse a una
  # excepción que exista en este archivo, esté vigente y cubra la regla y la ruta de la alerta.
  archivo_excepciones: .github/security/excepciones-codigo.yml
  # Motivos de la API: "false positive" | "won't fix" | "used in tests" | "mitigated"
  motivos_permitidos: ["false positive", "won't fix", "used in tests", "mitigated"]
  comentario_minimo: 20                         # caracteres mínimos de justificación
  requiere_id_excepcion: ["won't fix", "mitigated"]
  # Quién puede descartar (vacío = cualquiera con permiso). En una organización: miembros del equipo de seguridad.
  aprobadores: ["RonnyTabangoBIT"]
  # Delegated alert dismissal (solo organizaciones con Code Security): si está activo, las alertas de estas
  # severidades deben tener `dismissal_approved_by`. En un repo personal no existe, por eso queda en false.
  requiere_aprobacion_delegada: false
  severidades_con_aprobacion: [critical, high]

secret_scanning:
  # Resoluciones de la API: false_positive | wont_fix | revoked | used_in_tests
  resoluciones_permitidas: ["revoked", "false_positive", "used_in_tests", "wont_fix"]
  comentario_minimo: 20
  requiere_id_excepcion: ["wont_fix", "used_in_tests"]
  aprobadores: ["RonnyTabangoBIT"]
  # Bypass de push protection: la alerta no puede seguir abierta más de N días después del bypass.
  dias_maximos_abierta_tras_bypass: 7
